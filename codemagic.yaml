workflows:
  build_apk:
    name: Build Android Release APK
    max_build_duration: 120
    instance_type: linux

    environment:
      vars:
        # Path to keystore file (will be set to decoded file if ANDROID_KEYSTORE_BASE64 is provided)
        ANDROID_KEYSTORE_PATH: $CM_BUILD_DIR/keystores/keystore.jks
        ANDROID_KEYSTORE_PASSWORD: ""
        ANDROID_KEYSTORE_ALIAS: ""
        ANDROID_KEYSTORE_ALIAS_PASSWORD: ""
      # Secure variables must be set in the Codemagic UI (leave values empty here)
      secure:
        ANDROID_KEYSTORE_BASE64: ""

    cache:
      cache_paths:
        - ~/.gradle
        - ~/.android/build-cache

    scripts:
      - name: Prepare Gradle
        script: |
          chmod +x ./gradlew

      - name: Decode keystore (optional)
        script: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Decoding keystore to ./keystores/keystore.jks"
            mkdir -p ./keystores
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ./keystores/keystore.jks
            chmod 600 ./keystores/keystore.jks
            export ANDROID_KEYSTORE_PATH=./keystores/keystore.jks
          else
            echo "ANDROID_KEYSTORE_BASE64 not set; building unsigned (release will be unsigned)."
          fi

      - name: Build release APK
        script: |
          ./gradlew clean assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$ANDROID_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEYSTORE_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEYSTORE_ALIAS_PASSWORD"

    artifacts:
      - app/build/outputs/**/*.apk
